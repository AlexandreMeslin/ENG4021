name: Copy Issues to INF1407

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  copy:
    runs-on: ubuntu-latest
    if: github.repository == 'AlexandreMeslin/ENG4021'
    
    steps:
      - name: Setup GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y
      
      - name: Authenticate
        run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      
      - name: Copy issue to INF1407
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          gh issue create \
            --repo "AlexandreMeslin/INF1407" \
            --title "[ENG4021] $ISSUE_TITLE" \
            --body "**Issue original:** $ISSUE_URL

            **Autor:** @$ISSUE_AUTHOR

            ---

            $ISSUE_BODY" \
            --label "copied-from-eng4021"
      
      - name: Comment on original
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo "AlexandreMeslin/ENG4021" \
            --body "✅ Issue copiada para [INF1407](https://github.com/AlexandreMeslin/INF1407)"