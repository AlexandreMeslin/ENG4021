<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Secreta</title>
</head>
<body>
    <h1>Página Secreta</h1>

    <p>
        Esta é uma página secreta que só pode ser acessada por usuários autenticados.
    </p>

    <!-- Código para o formulário de logout -->
    <form method='POST' action="{% url 'logout' %}">
        {% csrf_token %}
        <button type='submit'>Logout</button>
    </form>
</body>
</html>
